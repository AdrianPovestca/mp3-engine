```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP3 Downloader</title>
<style>
:root {
  color-scheme: dark;
  --bg: #10120f;
  --panel: #1a1e19;
  --line: #30372e;
  --text: #f4f4ed;
  --muted: #a1a89d;
  --accent: #b6f36b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, sans-serif;
}
main { max-width: 850px; margin: 60px auto; padding: 0 20px; }
h1 { font-size: clamp(32px, 6vw, 48px); letter-spacing: -2px; margin: 0; }
.subtitle { color: var(--muted); margin: 8px 0 32px; }
.panel, .result {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
h2 { font-size: 17px; margin: 0 0 14px; }
form { display: flex; gap: 10px; }
input {
  min-width: 0; flex: 1; padding: 13px 14px;
  color: var(--text); background: #10120f;
  border: 1px solid var(--line); border-radius: 10px;
}
button, .link {
  border: 0; border-radius: 10px; padding: 12px 16px;
  background: var(--accent); color: #151910;
  font-weight: 700; cursor: pointer; text-decoration: none;
}
button:disabled { opacity: .5; cursor: wait; }
.results { display: grid; gap: 12px; }
.result { display: flex; align-items: center; gap: 14px; margin: 0; }
.result img { width: 104px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; }
.info { flex: 1; min-width: 0; }
.info strong { display: block; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.actions a { font-size: 13px; }
#status { color: var(--muted); margin: 14px 0; white-space: pre-wrap; }
@media(max-width: 560px) {
  main { margin-top: 30px; }
  form { flex-direction: column; }
  .result { align-items: flex-start; }
  .result img { width: 84px; }
}
</style>
</head>
<body>
<main>
  <h1>MP3 Downloader</h1>
  <p class="subtitle">Search tracks. Preview results. Convert audio files you can use.</p>

  <section class="panel">
    <h2>Search music</h2>
    <form id="searchForm">
      <input id="query" placeholder="Song title or artist..." required>
      <button id="searchButton">Search</button>
    </form>
  </section>

  <div id="status" role="status"></div>
  <section id="results" class="results"></section>

  <section class="panel">
    <h2>Convert a direct audio link to MP3</h2>
    <form id="downloadForm">
      <input id="audioUrl" type="url" placeholder="https://example.com/audio.mp3" required>
      <button id="downloadButton">Convert & download</button>
    </form>
    <p class="muted">Use a direct HTTPS audio-file URL. Maximum size: 50 MB.</p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const status = (message) => { $("status").textContent = message; };

$("searchForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const query = $("query").value.trim();
  if (!query) return;

  $("results").replaceChildren();
  status("Searching...");
  $("searchButton").disabled = true;

  try {
    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=10`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Search failed.");

    if (!data.results.length) {
      status("No results found. Try another title or artist.");
      return;
    }

    status(`${data.results.length} results found. Open a source to listen.`);
    for (const track of data.results) {
      const card = document.createElement("article");
      card.className = "result";

      if (track.thumbnail) {
        const image = document.createElement("img");
        image.src = track.thumbnail;
        image.alt = "";
        image.loading = "lazy";
        card.append(image);
      }

      const info = document.createElement("div");
      info.className = "info";

      const title = document.createElement("strong");
      title.textContent = track.title;
      const artist = document.createElement("div");
      artist.className = "muted";
      artist.textContent = track.artist || "YouTube result";

      const actions = document.createElement("div");
      actions.className = "actions";

      const source = document.createElement("a");
      source.className = "link";
      source.href = track.source_url;
      source.target = "_blank";
      source.rel = "noopener noreferrer";
      source.textContent = "Open source";

      const videoId = track.source_url.match(/[?&]v=([^&]+)/)?.[1];

      if (videoId) {
        const player = document.createElement("iframe");
        player.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId);
        player.title = track.title;
        player.width = "100%";
        player.height = "180";
        player.style.border = "0";
        player.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        player.allowFullscreen = true;
        player.loading = "lazy";
        info.append(player);
      }

      actions.append(source);
      info.append(title, artist, actions);
      card.append(info);
      $("results").append(card);
    }
  } catch (error) {
    status(error.message || "Something went wrong.");
  } finally {
    $("searchButton").disabled = false;
  }
});

$("downloadForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = $("downloadButton");
  button.disabled = true;
  status("Downloading and converting...");
  try {
    const response = await fetch("/api/download", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url: $("audioUrl").value.trim()})
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.detail || "Conversion failed.");
    }

    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = objectUrl;
    link.download = "audio.mp3";
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(objectUrl);
    status("MP3 downloaded.");
  } catch (error) {
    status(error.message || "Download failed.");
  } finally {
    button.disabled = false;
  }
});
</script>

<section class="panel">
  <h2>Convert audio to MP3</h2>
  <form id="uploadConvertForm">
    <input id="uploadAudioFile" type="file"
      accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,audio/*" required>
    <button id="uploadConvertButton" type="submit">Convert &amp; download MP3</button>
  </form>
  <p id="uploadConvertStatus" role="status" aria-live="polite"></p>
  <p class="muted">Audio files up to 50 MB.</p>
</section>

<script>
(() => {
  const form = document.getElementById("uploadConvertForm");
  if (!form) return;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const input = document.getElementById("uploadAudioFile");
    const button = document.getElementById("uploadConvertButton");
    const status = document.getElementById("uploadConvertStatus");
    const file = input.files[0];

    if (!file) {
      status.textContent = "Choose an audio file first.";
      return;
    }

    button.disabled = true;
    status.textContent = "Converting audio…";

    try {
      const data = new FormData();
      data.append("file", file);

      const response = await fetch("/api/convert-upload", {
        method: "POST",
        body: data
      });

      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.detail || "Conversion failed.");
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "converted.mp3";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = "MP3 downloaded.";
    } catch (error) {
      status.textContent = error.message || "Something went wrong.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>

</body>
</html>
